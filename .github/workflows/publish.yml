name: Publish Package

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  Prepare:
    concurrency:
      group: prepare-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - uses: Anupheaus/ci-templates/.github/actions/pnpm-setup@v1

  Validate:
    concurrency:
      group: validate-${{ github.ref }}
      cancel-in-progress: true
    needs: Prepare
    runs-on: ubuntu-latest
    steps:
      - uses: Anupheaus/ci-templates/.github/actions/pnpm-setup@v1
      - name: Lint
        run: pnpm exec eslint src --ext .ts,.tsx
      - name: Type check
        run: pnpm exec tsc -p tsconfig.build.json --noEmit
      - name: Security audit
        run: pnpm audit --audit-level high
      - name: Secret scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.before }}
          head: HEAD
          extra_args: --only-verified
      - name: Vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: 1

  Test:
    concurrency:
      group: test-${{ github.ref }}
      cancel-in-progress: true
    needs: Prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      statuses: write
    steps:
      - uses: Anupheaus/ci-templates/.github/actions/pnpm-setup@v1
      - name: Run tests with coverage
        run: pnpm exec c8 --reporter=lcov --reporter=text --reporter=json-summary mocha --config ./tests/mocha.js
      - name: Publish coverage status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PCT="$(node -e "const fs=require('fs');const files=['coverage/coverage-summary.json','coverage/vitest/coverage-summary.json'];const file=files.find(p=>fs.existsSync(p));if(!file)process.exit(1);const pct=Math.round(JSON.parse(fs.readFileSync(file,'utf8')).total.lines.pct);if(!Number.isFinite(pct)||pct<0||pct>100)process.exit(1);process.stdout.write(String(pct));")" || exit 0
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" -f state=success -f context=coverage -f description="${PCT}%"
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  Publish:
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: false
    needs: [Validate, Test]
    runs-on: ubuntu-latest
    if: github.repository_owner == 'Anupheaus'
    permissions:
      contents: write
      packages: write
    steps:
      - uses: Anupheaus/ci-templates/.github/actions/pnpm-setup@v1
        with:
          node-auth-token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Bump version
        uses: phips28/gh-action-bump-version@master
        with:
          version-type: patch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build
        run: pnpm run build
      - name: Pack
        run: pnpm pack
      - name: Publish
        run: |
          TGZ=$(ls anupheaus-common-*.tgz 2>/dev/null | head -1)
          if [ -z "$TGZ" ]; then
            echo "No package tarball found. Contents:"
            ls -la
            exit 1
          fi
          pnpm publish --no-git-checks "$TGZ"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
